<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="640" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="640" height="400" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 40h640M0 80h640M0 120h640M0 160h640M0 200h640M0 240h640M0 280h640M0 320h640M0 360h640" />
    <path d="M40 0v400M80 0v400M120 0v400M160 0v400M200 0v400M240 0v400M280 0v400M320 0v400M360 0v400M400 0v400M440 0v400M480 0v400M520 0v400M560 0v400M600 0v400" />
  </g>

  <!-- Window Header Bar -->
  <rect x="0" y="0" width="640" height="44" rx="16" fill="#0B0F19" />
  <rect x="0" y="30" width="640" height="14" fill="#0B0F19" />
  <line x1="0" y1="44" x2="640" y2="44" stroke="#334155" stroke-width="1" />
  
  <!-- Window Controls -->
  <circle cx="24" cy="22" r="5.5" fill="#EF4444" />
  <circle cx="42" cy="22" r="5.5" fill="#F59E0B" />
  <circle cx="60" cy="22" r="5.5" fill="#10B981" />

  <!-- Breadcrumb / URL Bar -->
  <rect x="180" y="10" width="280" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
  <text x="240" y="26" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">https://api.healthcare.io/docs</text>
  <circle cx="196" cy="22" r="3" fill="#10B981" />

  <!-- Fast API Badge -->
  <rect x="526" y="11" width="86" height="22" rx="5" fill="#009485" fill-opacity="0.2" stroke="#009485" stroke-width="1" />
  <text x="542" y="26" fill="#2DD4BF" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">⚡ FastAPI</text>

  <!-- Left Column: API Endpoints (Swagger / OpenAPI Style) -->
  <rect x="24" y="62" width="260" height="314" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
  <text x="40" y="88" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Patient Endpoints</text>
  <text x="220" y="88" fill="#64748B" font-family="monospace" font-size="11">v1.2.0</text>

  <!-- Endpoint 1: GET /patients -->
  <g transform="translate(36, 102)">
    <rect width="236" height="42" rx="8" fill="#1E293B" stroke="#2563EB" stroke-width="1" stroke-opacity="0.4" />
    <rect x="8" y="9" width="44" height="24" rx="5" fill="#2563EB" />
    <text x="17" y="25" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="700">GET</text>
    <text x="60" y="25" fill="#E2E8F0" font-family="monospace" font-size="11">/api/v1/patients</text>
  </g>

  <!-- Endpoint 2: POST /patients -->
  <g transform="translate(36, 152)">
    <rect width="236" height="42" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1" stroke-opacity="0.4" />
    <rect x="8" y="9" width="48" height="24" rx="5" fill="#10B981" />
    <text x="14" y="25" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="700">POST</text>
    <text x="64" y="25" fill="#E2E8F0" font-family="monospace" font-size="11">/api/v1/patients</text>
  </g>

  <!-- Endpoint 3: GET /patients/{id} -->
  <g transform="translate(36, 202)">
    <rect width="236" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <rect x="8" y="9" width="44" height="24" rx="5" fill="#3B82F6" fill-opacity="0.8" />
    <text x="17" y="25" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="700">GET</text>
    <text x="60" y="25" fill="#CBD5E1" font-family="monospace" font-size="10.5">/api/v1/patients/{id}</text>
  </g>

  <!-- Endpoint 4: PUT /patients/{id} -->
  <g transform="translate(36, 252)">
    <rect width="236" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <rect x="8" y="9" width="44" height="24" rx="5" fill="#F59E0B" />
    <text x="18" y="25" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="700">PUT</text>
    <text x="60" y="25" fill="#CBD5E1" font-family="monospace" font-size="10.5">/api/v1/patients/{id}</text>
  </g>

  <!-- Endpoint 5: Metrics -->
  <g transform="translate(36, 304)">
    <rect width="236" height="56" rx="8" fill="#0F172A" stroke="#334155" stroke-width="0.8" />
    <text x="14" y="22" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10.5">Response Time: <tspan fill="#10B981" font-weight="700">18 ms</tspan></text>
    <text x="14" y="42" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10.5">Success Rate: <tspan fill="#38BDF8" font-weight="700">99.98%</tspan></text>
  </g>

  <!-- Right Column: Live JSON Response Viewer -->
  <rect x="300" y="62" width="316" height="314" rx="12" fill="#0B1120" stroke="#334155" stroke-width="1" />
  
  <!-- Response Status Header -->
  <rect x="300" y="62" width="316" height="38" rx="12" fill="#1E293B" fill-opacity="0.6" />
  <text x="318" y="86" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Response Payload</text>
  <rect x="526" y="70" width="76" height="20" rx="4" fill="#065F46" />
  <text x="536" y="84" fill="#34D399" font-family="monospace" font-size="10" font-weight="700">200 OK</text>

  <!-- JSON Code Preview -->
  <g transform="translate(318, 116)" font-family="Consolas, 'Fira Code', Monaco, monospace" font-size="11" line-height="1.5">
    <text x="0" y="0" fill="#94A3B8">{</text>
    <text x="16" y="20" fill="#7DD3FC">"status"</text><text x="76" y="20" fill="#E2E8F0">: </text><text x="88" y="20" fill="#A7F3D0">"success"</text><text x="156" y="20" fill="#94A3B8">,</text>
    <text x="16" y="40" fill="#7DD3FC">"patient_id"</text><text x="104" y="40" fill="#E2E8F0">: </text><text x="116" y="40" fill="#FCD34D">"PT-2026-0891"</text><text x="218" y="40" fill="#94A3B8">,</text>
    <text x="16" y="60" fill="#7DD3FC">"name"</text><text x="60" y="60" fill="#E2E8F0">: </text><text x="72" y="60" fill="#A7F3D0">"Faizan Hassan"</text><text x="180" y="60" fill="#94A3B8">,</text>
    <text x="16" y="80" fill="#7DD3FC">"age"</text><text x="52" y="80" fill="#E2E8F0">: </text><text x="64" y="80" fill="#FCD34D">21</text><text x="80" y="80" fill="#94A3B8">,</text>
    <text x="16" y="100" fill="#7DD3FC">"department"</text><text x="108" y="100" fill="#E2E8F0">: </text><text x="120" y="100" fill="#A7F3D0">"Neurology"</text><text x="204" y="100" fill="#94A3B8">,</text>
    <text x="16" y="120" fill="#7DD3FC">"ai_triage_score"</text><text x="136" y="120" fill="#E2E8F0">: </text><text x="148" y="120" fill="#C084FC">0.04</text><text x="180" y="120" fill="#94A3B8">,</text>
    <text x="16" y="140" fill="#7DD3FC">"condition"</text><text x="96" y="140" fill="#E2E8F0">: </text><text x="108" y="140" fill="#34D399">"Optimal / Stable"</text><text x="246" y="140" fill="#94A3B8">,</text>
    <text x="16" y="160" fill="#7DD3FC">"last_updated"</text><text x="116" y="160" fill="#E2E8F0">: </text><text x="128" y="160" fill="#FCD34D">"2026-10-06T09:45Z"</text>
    <text x="0" y="180" fill="#94A3B8">}</text>
  </g>

  <!-- Interactive Validation Indicator -->
  <g transform="translate(318, 328)">
    <rect width="280" height="34" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
    <circle cx="16" cy="17" r="4" fill="#10B981" />
    <text x="28" y="21" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Pydantic Schema Validation: <tspan fill="#F8FAFC" font-weight="600">Passed (0 errors)</tspan></text>
  </g>
</svg>
